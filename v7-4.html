function delta(before,after){const out=[];const be=before.entries||[],ae=after.entries||[],bt=before.trips||[],at=after.trips||[];const bm=new Map(be.map(x=>[String(x.id),x])),am=new Map(ae.map(x=>[String(x.id),x]));for(const [id,x] of am)if(!bm.has(id))out.push({kind:'entry-add',id,after:x,label:(x.type==='income'?'دخل':'مصروف')+' $'+Number(x.amount||0)+' • '+(x.source||'')});for(const [id,x] of bm)if(!am.has(id))out.push({kind:'entry-delete',id,before:x,label:'حذف '+(x.type==='income'?'دخل':'مصروف')+' $'+Number(x.amount||0)+' • '+(x.source||'')});for(const [id,x] of am)if(bm.has(id)&&JSON.stringify(bm.get(id))!==JSON.stringify(x))out.push({kind:'entry-update',id,before:bm.get(id),after:x,label:'تعديل حركة #'+id});const btm=new Map(bt.map(x=>[String(x.id),x])),atm=new Map(at.map(x=>[String(x.id),x]));for(const [id,x] of atm)if(!btm.has(id))out.push({kind:'trip-add',id,after:x,label:'رحلة '+Number(x.miles||0)+' ميل • '+Number(x.hours||0)+' ساعة'});for(const [id,x] of btm)if(!atm.has(id))out.push({kind:'trip-delete',id,before:x,label:'حذف رحلة '+Number(x.miles||0)+' ميل'});for(const [id,x] of atm)if(btm.has(id)&&JSON.stringify(btm.get(id))!==JSON.stringify(x))out.push({kind:'trip-update',id,before:btm.get(id),after:x,label:'تعديل رحلة'});const bs=before.settings||{},as=after.settings||{};for(const k of ['dailyGoal','bills','saving','carPerMile'])if(JSON.stringify(bs[k])!==JSON.stringify(as[k]))out.push({kind:'setting',key:k,before:bs[k],after:as[k],label:'تغيير '+({dailyGoal:'الهدف اليومي',bills:'الالتزامات',saving:'الادخار',carPerMile:'تكلفة الميل'}[k]||k)+' من '+(bs[k]??'—')+' إلى '+(as[k]??'—')});return out}
function rollbackChange(ch){const d=read();if(ch.kind==='entry-add')d.entries=(d.entries||[]).filter(x=>String(x.id)!==String(ch.id));else if(ch.kind==='entry-delete'){d.entries=d.entries||[];if(!d.entries.some(x=>String(x.id)===String(ch.id)))d.entries.push(ch.before)}else if(ch.kind==='entry-update')d.entries=(d.entries||[]).map(x=>String(x.id)===String(ch.id)?ch.before:x);else if(ch.kind==='trip-add')d.trips=(d.trips||[]).filter(x=>String(x.id)!==String(ch.id));else if(ch.kind==='trip-delete'){d.trips=d.trips||[];if(!d.trips.some(x=>String(x.id)===String(ch.id)))d.trips.push(ch.before)}else if(ch.kind==='trip-update')d.trips=(d.trips||[]).map(x=>String(x.id)===String(ch.id)?ch.before:x);else if(ch.kind==='setting'){d.settings=d.settings||{};if(ch.before===undefined)delete d.settings[ch.key];else d.settings[ch.key]=ch.before}write(d)}
