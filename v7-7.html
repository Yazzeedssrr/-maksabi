<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>مَكسبي V7.7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}#app{width:100%;height:100dvh;border:0;display:block}.loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.loading.hide{display:none}</style></head><body><div id="loading" class="loading">جاري تشغيل مَكسبي V7.7…</div><iframe id="app" src="/v7-6.html?v=20260916-v77" allow="geolocation;camera;microphone"></iframe><script>
const root=document.getElementById('app'),loading=document.getElementById('loading');
const read=()=>{try{return JSON.parse(localStorage.getItem('maksabi2')||'{}')}catch{return{}}};
function deepest(win){try{let w=win;for(let i=0;i<10;i++){const f=w.document?.getElementById('app');if(!f?.contentWindow)break;w=f.contentWindow}return w}catch{return null}}
function norm(s){s=String(s||'').trim().toLowerCase();if(/amazon|flex/.test(s))return'Amazon Flex';if(/door\s*dash|doordash|دورداش/.test(s))return'DoorDash';if(/uber/.test(s))return'Uber';if(/lyft/.test(s))return'Lyft';return s?String(s).trim():'أخرى'}
function dateCut(days){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-days+1);return d.toISOString().slice(0,10)}
function perf(days){const d=read(),from=dateCut(days),sources={},rpm=Number(d.settings?.carPerMile||0);const get=k=>sources[k]||(sources[k]={source:k,income:0,expense:0,miles:0,hours:0,entries:0,trips:0});for(const x of d.entries||[]){if(String(x.date||'')<from)continue;const k=norm(x.source);const s=get(k);s.entries++;if(x.type==='income')s.income+=Number(x.amount||0);else s.expense+=Number(x.amount||0)}for(const x of d.trips||[]){if(String(x.date||'')<from)continue;const k=norm(x.source);const s=get(k);s.trips++;s.miles+=Number(x.miles||0);s.hours+=Number(x.hours||0)}return Object.values(sources).map(s=>({...s,reserve:s.miles*rpm,net:s.income-s.expense-s.miles*rpm,perHour:s.hours>0?(s.income-s.expense-s.miles*rpm)/s.hours:null,perMile:s.miles>0?(s.income-s.expense-s.miles*rpm)/s.miles:null})).sort((a,b)=>b.net-a.net)}
function trend(){const d=read();function period(start,end){let inc=0,exp=0,m=0,h=0;for(const x of d.entries||[]){if(x.date>=start&&x.date<=end){if(x.type==='income')inc+=+x.amount||0;else exp+=+x.amount||0}}for(const x of d.trips||[]){if(x.date>=start&&x.date<=end){m+=+x.miles||0;h+=+x.hours||0}}return{inc,exp,m,h,net:inc-exp-m*Number(d.settings?.carPerMile||0)}}let today=new Date();today.setHours(0,0,0,0);let e1=new Date(today),s1=new Date(today);s1.setDate(s1.getDate()-6);let e0=new Date(s1);e0.setDate(e0.getDate()-1);let s0=new Date(e0);s0.setDate(s0.getDate()-6);const f=x=>x.toISOString().slice(0,10),a=period(f(s1),f(e1)),b=period(f(s0),f(e0));return{current:a,previous:b,delta:b.net?((a.net-b.net)/Math.abs(b.net))*100:null}}
function money(n){return'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function renderDecision(d){const host=d.getElementById('decisionBody');if(!host)return;const p7=perf(7),p30=perf(30),tr=trend();host.innerHTML='';if(!p30.length){host.innerHTML='<div class="card"><span class="muted">لا توجد بيانات كافية للمقارنة بعد.</span></div>';return}const top=p30.filter(x=>x.income||x.hours||x.miles);for(const x of top){const c=d.createElement('div');c.className='card';c.innerHTML='<b>'+x.source+'</b><div class="muted" style="line-height:1.9;margin-top:7px">دخل '+money(x.income)+' • مصروف '+money(x.expense)+' • صافي بعد مخصص السيارة '+money(x.net)+'<br>'+(x.hours>0?'صافي/ساعة '+money(x.perHour)+' • ':'')+(x.miles>0?'صافي/ميل '+money(x.perMile)+' • ':'')+x.miles.toFixed(1)+' ميل • '+x.hours.toFixed(1)+' ساعة</div>';host.appendChild(c)}const s=d.createElement('div');s.className='card';let delta=tr.delta===null?'لا توجد فترة سابقة كافية':((tr.delta>=0?'+':'')+tr.delta.toFixed(1)+'% مقارنة بالأسبوع السابق');s.innerHTML='<h3>الاتجاه الأسبوعي</h3><div class="muted">صافي آخر 7 أيام '+money(tr.current.net)+' • '+delta+'</div>';host.appendChild(s);const usable=p30.filter(x=>x.hours>0);if(usable.length){const byH=[...usable].sort((a,b)=>b.perHour-a.perHour)[0],byM=[...p30.filter(x=>x.miles>0)].sort((a,b)=>b.perMile-a.perMile)[0];const c=d.createElement('div');c.className='card';c.innerHTML='<h3>مؤشرات القرار</h3><div class="muted" style="line-height:1.9">أعلى صافي/ساعة في البيانات المسجلة: <b>'+byH.source+'</b> عند '+money(byH.perHour)+(byM?'<br>أعلى صافي/ميل: <b>'+byM.source+'</b> عند '+money(byM.perMile):'')+'<br><small>هذه مؤشرات وصفية من بياناتك المسجلة، وليست ضمانًا لما ستكسبه مستقبلًا.</small></div>';host.appendChild(c)}}
function patch(){const w=deepest(root.contentWindow);if(!w?.document)return false;const d=w.document;try{d.title='مَكسبي V7.7';const brand=d.querySelector('.brand b');if(brand)brand.textContent='مَكسبي V7.7';const small=d.querySelector('.brand small');if(small)small.textContent='لوحة قرارات ذكية • مقارنة المصادر • AI • فيديو • GPS';const main=d.querySelector('main.wrap');if(main&&!d.getElementById('decision')){const s=d.createElement('section');s.id='decision';s.innerHTML='<h2>لوحة القرارات الذكية</h2><div class="card"><p class="muted">تقارن أداء مصادر العمل من بياناتك المسجلة خلال آخر 30 يومًا، وتفصل الدخل والمصاريف والميلات والساعات.</p><button id="decisionAI" class="primary wide">حلل هذه النتائج بالذكاء الاصطناعي</button></div><div id="decisionBody"></div>';main.appendChild(s);d.getElementById('decisionAI').onclick=()=>{try{w.go('ai');const t=d.getElementById('txt');t.value='قارن أداء مصادر عملي باستخدام بيانات مكسبي، خصوصًا Amazon Flex وDoorDash وUber وLyft إن وجدت. قارن صافي الربح، الصافي لكل ساعة، الصافي لكل ميل، المصاريف، واتجاه آخر 7 و30 يومًا. اشرح القيود إذا كانت ساعات أو ميلات بعض المصادر ناقصة، ولا تغير أي بيانات.';w.sendAI()}catch(e){console.warn(e)}}}const drawer=d.querySelector('.drawer');if(drawer&&!d.getElementById('decisionNav')){const b=d.createElement('button');b.id='decisionNav';b.textContent='📊 لوحة القرارات';b.onclick=()=>{w.go('decision');renderDecision(d)};drawer.appendChild(b)}if(!w.__v77ctx&&typeof w.ctx==='function'){w.__v77ctx=true;const old=w.ctx;w.ctx=function(){const c=old();c.sourcePerformance30d=perf(30);c.sourcePerformance7d=perf(7);c.weekTrend=trend();return c}}const oldGo=w.go;if(typeof oldGo==='function'&&!w.__v77go){w.__v77go=true;w.go=function(id){const r=oldGo.apply(this,arguments);if(id==='decision')renderDecision(d);return r}}renderDecision(d);loading.classList.add('hide');return true}catch(e){console.warn('V7.7 patch',e);return false}}
function wait(){if(patch())return;setTimeout(wait,450)}root.addEventListener('load',()=>setTimeout(wait,500));setTimeout(()=>loading.classList.add('hide'),10000)
</script></body></html>
