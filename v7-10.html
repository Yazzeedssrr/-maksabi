function renderClose(doc){const x=report(),host=doc.getElementById('closeBody');if(!host)return;host.innerHTML='';const hero=doc.createElement('div');hero.className='card';hero.innerHTML='<span class="pill">🌙 إغلاق اليوم</span><h2 style="margin:10px 0 4px">'+x.verdict+'</h2><div style="font-size:36px;font-weight:900">'+money(x.net)+'</div><div class="muted">صافي اليوم بعد مخصص السيارة</div>';host.appendChild(hero);const c=doc.createElement('div');c.className='card';let lines='الدخل '+money(x.income)+' • المصروف '+money(x.expense)+' • مخصص السيارة '+money(x.reserve)+'<br>'+x.miles.toFixed(1)+' ميل • '+x.hours.toFixed(1)+' ساعة';if(x.perHour!==null)lines+='<br>الصافي/ساعة '+money(x.perHour);if(x.perMile!==null)lines+=' • الصافي/ميل '+money(x.perMile);if(x.goal>0)lines+='<br>'+(x.goalDelta>=0?'فوق الهدف بـ '+money(x.goalDelta):'ناقص عن الهدف '+money(Math.abs(x.goalDelta)));if(x.vsAvg!==null)lines+='<br>'+(x.vsAvg>=0?'أفضل من متوسط آخر الأيام النشطة بـ '+money(x.vsAvg):'أقل من متوسط آخر الأيام النشطة بـ '+money(Math.abs(x.vsAvg)));c.innerHTML='<h3>تقرير اليوم</h3><div class="muted" style="line-height:1.9">'+lines+'</div>';host.appendChild(c);const q=doc.createElement('div');q.className='card';let notes=[];if(x.income>0&&x.hours===0)notes.push('يوجد دخل بدون ساعات مسجلة؛ تحليل صافي/ساعة غير مكتمل.');if(x.income>0&&x.miles===0)notes.push('يوجد دخل بدون ميلات مسجلة؛ تكلفة السيارة قد تكون أقل من الواقع.');if(!x.income&&!x.expense&&!x.hours&&!x.miles)notes.push('لا توجد بيانات كافية لإغلاق اليوم.');if(!notes.length)notes.push('بيانات اليوم تبدو مكتملة بما يكفي لتقرير أساسي.');q.innerHTML='<h3>فحص اكتمال البيانات</h3><div class="muted" style="line-height:1.9">'+notes.map(n=>'• '+n).join('<br>')+'</div>';host.appendChild(q)}
