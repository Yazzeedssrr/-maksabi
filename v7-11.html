const root=document.getElementById('app'),loading=document.getElementById('loading');
const read=()=>{try{return JSON.parse(localStorage.getItem('maksabi2')||'{}')}catch{return{}}};
function deepest(win){try{let w=win;for(let i=0;i<18;i++){const f=w.document?.getElementById('app');if(!f?.contentWindow)break;w=f.contentWindow}return w}catch{return null}}
function day(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function norm(s){s=String(s||'').trim().toLowerCase();if(/amazon|flex/.test(s))return'Amazon Flex';if(/door\s*dash|doordash|دورداش/.test(s))return'DoorDash';if(/uber/.test(s))return'Uber';if(/lyft/.test(s))return'Lyft';return s?String(s).trim():'أخرى'}
function range(offset){const end=new Date();end.setHours(0,0,0,0);end.setDate(end.getDate()-offset*7);const start=new Date(end);start.setDate(start.getDate()-6);return{start:day(start),end:day(end)}}
function calc(r){const d=read(),rpm=Number(d.settings?.carPerMile||0),days={},src={};const gd=k=>days[k]||(days[k]={date:k,income:0,expense:0,miles:0,hours:0}),gs=k=>src[k]||(src[k]={source:k,income:0,expense:0,miles:0,hours:0});for(const x of d.entries||[]){if(x.date<r.start||x.date>r.end)continue;const a=gd(x.date),s=gs(norm(x.source));if(x.type==='income'){a.income+=+x.amount||0;s.income+=+x.amount||0}else{a.expense+=+x.amount||0;s.expense+=+x.amount||0}}for(const x of d.trips||[]){if(x.date<r.start||x.date>r.end)continue;const a=gd(x.date),s=gs(norm(x.source));a.miles+=+x.miles||0;a.hours+=+x.hours||0;s.miles+=+x.miles||0;s.hours+=+x.hours||0}const fin=o=>({...o,reserve:o.miles*rpm,net:o.income-o.expense-o.miles*rpm,perHour:o.hours>0?(o.income-o.expense-o.miles*rpm)/o.hours:null,perMile:o.miles>0?(o.income-o.expense-o.miles*rpm)/o.miles:null});const dl=Object.values(days).map(fin).sort((a,b)=>a.date.localeCompare(b.date)),sl=Object.values(src).map(fin).sort((a,b)=>b.net-a.net);const total=fin(dl.reduce((a,x)=>({income:a.income+x.income,expense:a.expense+x.expense,miles:a.miles+x.miles,hours:a.hours+x.hours}),{income:0,expense:0,miles:0,hours:0}));return{range:r,total,days:dl,sources:sl,bestDay:[...dl].sort((a,b)=>b.net-a.net)[0]||null,worstDay:[...dl].sort((a,b)=>a.net-b.net)[0]||null}}
function report(){const cur=calc(range(0)),prev=calc(range(1)),pct=(a,b)=>b===0?null:(a-b)/Math.abs(b)*100,expenseRatio=cur.total.income>0?cur.total.expense/cur.total.income*100:null;return{current:cur,previous:prev,netChangePct:pct(cur.total.net,prev.total.net),incomeChangePct:pct(cur.total.income,prev.total.income),expenseRatio,activeDays:cur.days.filter(x=>x.income||x.expense||x.hours||x.miles).length}}
function money(n){return'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}function pct(n){return n===null?'—':(n>=0?'+':'')+n.toFixed(1)+'%'}
function render(doc){const host=doc.getElementById('weeklyBody');if(!host)return;const x=report(),c=x.current,p=x.previous;host.innerHTML='';const hero=doc.createElement('div');hero.className='card';hero.innerHTML='<span class="pill">آخر 7 أيام</span><h3 style="margin-bottom:6px">صافي '+money(c.total.net)+'</h3><div class="muted" style="line-height:1.9">دخل '+money(c.total.income)+' • مصروف '+money(c.total.expense)+' • مخصص سيارة '+money(c.total.reserve)+'<br>'+c.total.hours.toFixed(1)+' ساعة • '+c.total.miles.toFixed(1)+' ميل • '+x.activeDays+' أيام نشطة<br>صافي/ساعة '+(c.total.perHour===null?'—':money(c.total.perHour))+' • صافي/ميل '+(c.total.perMile===null?'—':money(c.total.perMile))+'</div>';host.appendChild(hero);const trend=doc.createElement('div');trend.className='card';trend.innerHTML='<h3>مقارنة بالأسبوع السابق</h3><div class="muted" style="line-height:1.9">تغير الصافي: <b>'+pct(x.netChangePct)+'</b><br>تغير الدخل: <b>'+pct(x.incomeChangePct)+'</b><br>صافي الأسبوع السابق: '+money(p.total.net)+(x.expenseRatio!==null?'<br>المصاريف المباشرة = '+x.expenseRatio.toFixed(1)+'% من الدخل':'')+'</div>';host.appendChild(trend);if(c.bestDay||c.worstDay){const days=doc.createElement('div');days.className='card';days.innerHTML='<h3>الأيام</h3><div class="muted" style="line-height:1.9">'+(c.bestDay?'أعلى صافي يوم: <b>'+c.bestDay.date+'</b> • '+money(c.bestDay.net):'')+(c.worstDay?'<br>أقل صافي يوم: <b>'+c.worstDay.date+'</b> • '+money(c.worstDay.net):'')+'</div>';host.appendChild(days)}if(c.sources.length){const s=doc.createElement('div');s.className='card';s.innerHTML='<h3>مصادر العمل</h3>';for(const z of c.sources){const row=doc.createElement('div');row.style.cssText='padding:9px 0;border-top:1px solid rgba(255,255,255,.08)';row.innerHTML='<b>'+z.source+'</b><div class="muted">صافي '+money(z.net)+' • دخل '+money(z.income)+(z.perHour!==null?' • '+money(z.perHour)+'/ساعة':'')+'</div>';s.appendChild(row)}host.appendChild(s)}const q=[];if(c.total.income>0&&c.total.hours===0)q.push('لديك دخل مسجل هذا الأسبوع بدون ساعات عمل؛ صافي/ساعة غير مكتمل.');if(c.total.income>0&&c.total.miles===0)q.push('لديك دخل مسجل بدون ميلات؛ تكلفة السيارة قد تكون ناقصة.');if(q.length){const a=doc.createElement('div');a.className='card';a.innerHTML='<h3>جودة البيانات</h3><div class="muted">'+q.join('<br>')+'</div>';host.appendChild(a)}}

</script></body></html>
