<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>مَكسبي V7.3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}#app{width:100%;height:100dvh;border:0;display:block}.loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.loading.hide{display:none}</style></head><body><div id="loading" class="loading">جاري تشغيل مَكسبي V7.3…</div><iframe id="app" src="/v7-1.html?v=20260916-v73" allow="geolocation;camera;microphone"></iframe><script>
const frame=document.getElementById('app'),loading=document.getElementById('loading'),AUDIT='maksabi_audit_v73';
const clone=x=>JSON.parse(JSON.stringify(x||{}));
function read(){try{return JSON.parse(localStorage.getItem('maksabi2')||'{}')}catch{return{}}}
function write(x){localStorage.setItem('maksabi2',JSON.stringify(x))}
function audits(){try{return JSON.parse(localStorage.getItem(AUDIT)||'[]')}catch{return[]}}
function saveAudits(a){localStorage.setItem(AUDIT,JSON.stringify(a.slice(0,80)))}
function money(n){return'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function day(x=new Date()){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function sums(d,date){const a=(d.entries||[]).filter(x=>x.date===date);return[a.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0)]}
function buildInsights(){const d=read(),t=day(),[i,e]=sums(d,t),tr=(d.trips||[]).filter(x=>x.date===t),m=tr.reduce((s,x)=>s+Number(x.miles||0),0),h=tr.reduce((s,x)=>s+Number(x.hours||0),0),reserve=m*Number(d.settings?.carPerMile||0),net=i-e-reserve,goal=Number(d.settings?.dailyGoal||200),items=[];if(i||e||m||h){items.push(net<goal?'باقي على هدف اليوم '+money(Math.max(0,goal-net))+'.':'هدف اليوم متحقق بفارق '+money(net-goal)+'.');if(h>0)items.push('صافي الساعة '+money(net/h)+'.');if(m>0)items.push('الدخل لكل ميل '+money(i/m)+'، ومخصص السيارة '+money(reserve)+'.');if(i>0&&e/i>=.3)items.push('المصاريف تساوي '+Math.round(e/i*100)+'% من دخل اليوم؛ راجعها.');if(h===0&&i>0)items.push('يوجد دخل اليوم بلا ساعات عمل مسجلة.');if(m===0&&i>0)items.push('يوجد دخل اليوم بلا ميلات مسجلة.')}else items.push('لا توجد بيانات كافية لليوم بعد.');let wi=0,we=0,active=0;for(let k=0;k<7;k++){let x=new Date();x.setDate(x.getDate()-k);let[a,b]=sums(d,day(x));wi+=a;we+=b;if(a||b)active++}if(active>=2){const avg=(wi-we)/active;items.push('متوسط الصافي في الأيام النشطة خلال آخر 7 أيام: '+money(avg)+'.');const need=Number(d.settings?.bills||0)+Number(d.settings?.saving||0);if(need>0){const pace=avg*30;items.push(pace>=need?'وتيرتك الحالية أعلى من احتياجك الشهري المحدد.':'وتيرتك الحالية أقل من الالتزامات + الادخار بحوالي '+money(Math.max(0,need-pace))+' شهريًا إذا استمر نفس المتوسط.')}}return items}
function describeAudit(a){return Array.isArray(a.descriptions)&&a.descriptions.length?a.descriptions.join(' • '):'تنفيذ بواسطة المساعد'}
function renderAudit(doc){const host=doc.getElementById('auditList');if(!host)return;const a=audits();if(!a.length){host.innerHTML='<span class="muted">لا توجد عمليات منفذة بواسطة المساعد بعد.</span>';return}host.innerHTML='';a.slice(0,30).forEach((x,i)=>{const row=doc.createElement('div');row.className='card';row.style.marginTop='8px';const when=new Date(x.at).toLocaleString('ar');const t=doc.createElement('b');t.textContent=(x.undone?'↩ تم التراجع • ':'✅ تم التنفيذ • ')+when;const p=doc.createElement('div');p.className='muted';p.style.marginTop='6px';p.textContent=describeAudit(x);row.append(t,p);if(i===0&&!x.undone){const b=doc.createElement('button');b.className='secondary wide';b.style.marginTop='10px';b.textContent='↩ التراجع عن هذا التنفيذ';b.onclick=()=>undoLatest(doc);row.appendChild(b)}host.appendChild(row)})}
function undoLatest(doc){const a=audits(),x=a.find(v=>!v.undone);if(!x||!x.before)return;const cur=read(),rest=clone(x.before);rest.aiHistory=Array.isArray(cur.aiHistory)?cur.aiHistory:[];rest.personalMemory=cur.personalMemory||rest.personalMemory||'';rest.lastExecuted=Array.isArray(cur.lastExecuted)?cur.lastExecuted:[];rest.aiHistory.push({role:'assistant',content:'تم التراجع عن آخر تنفيذ محفوظ في سجل مكسبي ↩️'});write(rest);x.undone=true;x.undoneAt=new Date().toISOString();saveAudits(a);frame.contentWindow.location.reload()}
function askAI(w,prompt){try{w.go('ai');const txt=w.document.getElementById('txt');txt.value=prompt;w.sendAI()}catch(e){console.warn(e)}}
function patch(){const w=frame.contentWindow,doc=w.document;if(!w||!doc)return;loading.classList.add('hide');try{doc.title='مَكسبي V7.3';const brand=doc.querySelector('.brand b');if(brand)brand.textContent='مَكسبي V7.3';const small=doc.querySelector('.brand small');if(small)small.textContent='مساعد ذكي • سجل تنفيذ • تراجع دائم • صور وفيديو • GPS';const drawer=doc.querySelector('.drawer');const main=doc.querySelector('main.wrap');if(drawer&&!doc.getElementById('auditNav')){const b=doc.createElement('button');b.id='auditNav';b.textContent='🧾 سجل تنفيذ المساعد';b.onclick=()=>w.go('audit');const settingsBtn=[...drawer.querySelectorAll('button')].find(x=>x.textContent.includes('الإعدادات'));drawer.insertBefore(b,settingsBtn||null)}if(main&&!doc.getElementById('audit')){const s=doc.createElement('section');s.id='audit';s.innerHTML='<h2>سجل تنفيذ المساعد</h2><div class="card"><p class="muted">يسجل مكسبي كل تنفيذ وافقت عليه حتى تعرف ماذا تغيّر ومتى. يمكن التراجع عن أحدث تنفيذ حتى بعد تحديث الصفحة.</p></div><div id="auditList"></div>';main.appendChild(s)}const home=doc.getElementById('home');if(home&&!doc.getElementById('smartInsights')){const card=doc.createElement('div');card.id='smartInsights';card.className='card';card.innerHTML='<h3>🧠 تنبيهات مكسبي الذكية</h3><div id="insightList" class="muted" style="line-height:1.8"></div>';const btn=doc.createElement('button');btn.className='primary wide';btn.style.marginTop='12px';btn.textContent='حلل وضعي بعمق';btn.onclick=()=>askAI(w,'حلل وضعي الحالي في مكسبي بعمق باستخدام بيانات اليوم وآخر 7 أيام والأهداف. لا تغير أي بيانات إلا بطلب صريح مني.');card.appendChild(btn);const week=doc.getElementById('week')?.parentElement;if(week&&week.parentNode)week.parentNode.insertBefore(card,week);else home.appendChild(card)}const paint=()=>{const el=doc.getElementById('insightList');if(el)el.innerHTML=buildInsights().map(x=>'• '+x).join('<br>');renderAudit(doc)};paint();const oldRender=w.render;if(typeof oldRender==='function')w.render=function(...args){const r=oldRender.apply(this,args);try{paint()}catch{}return r};const oldApply=w.applyPending;if(typeof oldApply==='function'&&!w.__v73Audit){w.__v73Audit=true;w.applyPending=function(){const before=clone(read());const descriptions=[...doc.querySelectorAll('#actions .actionItem')].map(x=>x.textContent.trim()).filter(Boolean);oldApply.apply(this,arguments);const after=clone(read());if(JSON.stringify(before.entries)!==JSON.stringify(after.entries)||JSON.stringify(before.trips)!==JSON.stringify(after.trips)||JSON.stringify(before.settings)!==JSON.stringify(after.settings)){const a=audits();a.unshift({id:Date.now(),at:new Date().toISOString(),descriptions,before:{...before,activeTrip:null},after:{entries:after.entries,trips:after.trips,settings:after.settings},undone:false});saveAudits(a);renderAudit(doc)}}}const oldGo=w.go;if(typeof oldGo==='function')w.go=function(id){const r=oldGo.apply(this,arguments);if(id==='audit')renderAudit(doc);return r};}catch(e){console.warn('V7.3 patch error',e)}}
frame.addEventListener('load',patch);setTimeout(()=>loading.classList.add('hide'),7000)
</script></body></html>
