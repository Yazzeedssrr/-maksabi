<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><title>مَكسبي</title><style>:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#6e6e73;--line:#e5e5ea;--good:#16834f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:720px;margin:auto;padding:30px 16px 100px}h1{font-size:34px;margin:5px 0}.sub,small{color:var(--muted)}.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0}.big{font-size:38px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);padding:15px;border-radius:18px}.stat b{display:block;font-size:22px}.progress{height:12px;background:var(--line);border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--good)}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select,button{width:100%;font:inherit;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text)}button{border:0;background:#111;color:white;font-weight:700}.entry{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.green{color:var(--good)}.hide{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}nav div{max-width:720px;margin:auto;display:flex;gap:6px}nav button{font-size:12px;padding:10px 4px}</style></head><body><main><section id="home"><h1>مَكسبي</h1><div class="sub">كل دولار له هدف.</div><div class="card"><small>دخل اليوم</small><div class="big" id="todayIncome">$0</div><div class="progress"><div class="bar" id="bar"></div></div><div id="goalText"></div></div><div class="grid"><div class="stat"><small>مصاريف اليوم</small><b id="todayExpense">$0</b></div><div class="stat"><small>صافي اليوم</small><b id="todayNet">$0</b></div><div class="stat"><small>دخل الشهر</small><b id="monthIncome">$0</b></div><div class="stat"><small>صافي الشهر</small><b id="monthNet">$0</b></div></div><div class="card"><b>الالتزامات + الادخار</b><div id="monthGoal"></div></div></section><section id="add" class="hide"><h1>إضافة حركة</h1><div class="card"><label>النوع</label><select id="type"><option value="income">دخل</option><option value="expense">مصروف</option></select><label>المبلغ</label><input id="amount" inputmode="decimal" placeholder="0.00"><label>المصدر / التصنيف</label><select id="source"><option>Amazon Flex</option><option>DoorDash</option><option>Uber</option><option>Lyft</option><option>بنزين</option><option>صيانة</option><option>طعام</option><option>ديون والتزامات</option><option>أخرى</option></select><label>ملاحظة</label><input id="note" placeholder="اختياري"><button onclick="addEntry()">حفظ</button></div></section><section id="work" class="hide"><h1>يوم العمل</h1><div class="card"><label>عداد البداية</label><input id="startMiles" inputmode="decimal"><label>عداد النهاية</label><input id="endMiles" inputmode="decimal"><label>ساعات العمل</label><input id="hours" inputmode="decimal"><label>احتياطي السيارة لليوم</label><input id="reserve" inputmode="decimal" value="60"><button onclick="calcWork()">احسب يومي</button><div id="workResult" style="margin-top:15px"></div></div></section><section id="history" class="hide"><h1>السجل</h1><div class="card" id="entries"></div></section><section id="settings" class="hide"><h1>الإعدادات</h1><div class="card"><label>هدف الدخل اليومي</label><input id="dailyGoal" value="200" inputmode="decimal"><label>الالتزامات الشهرية</label><input id="bills" value="3000" inputmode="decimal"><label>هدف الادخار الشهري</label><input id="saving" value="1000" inputmode="decimal"><button onclick="saveSettings()">حفظ</button></div></section></main><nav><div><button onclick="show('home')">الرئيسية</button><button onclick="show('add')">+ إضافة</button><button onclick="show('work')">العمل</button><button onclick="show('history')">السجل</button><button onclick="show('settings')">الإعدادات</button></div></nav><script>const $=x=>document.getElementById(x),money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});let d=JSON.parse(localStorage.getItem('maksabi')||'{"entries":[],"settings":{"dailyGoal":200,"bills":3000,"saving":1000}}');function save(){localStorage.setItem('maksabi',JSON.stringify(d))}function date(){let x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hide'));$(id).classList.remove('hide');render()}function sums(f){let a=d.entries.filter(f);return[a.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),a.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)]}function addEntry(){let a=parseFloat($('amount').value);if(!a)return alert('أدخل المبلغ');d.entries.unshift({date:date(),type:$('type').value,amount:a,source:$('source').value,note:$('note').value});save();$('amount').value='';$('note').value='';show('home')}function saveSettings(){d.settings={dailyGoal:+$('dailyGoal').value||200,bills:+$('bills').value||0,saving:+$('saving').value||0};save();show('home')}function calcWork(){let s=+$('startMiles').value,e=+$('endMiles').value,h=+$('hours').value,r=+$('reserve').value||0,m=e>s?e-s:0,[i,x]=sums(v=>v.date===date());$('workResult').innerHTML='<b>'+m.toFixed(1)+' ميل</b><br>الدخل لكل ميل: '+money(m?i/m:0)+'<br>الدخل لكل ساعة: '+money(h?i/h:0)+'<br>الصافي بعد المصاريف واحتياطي السيارة: '+money(i-x-r)}function render(){let t=date(),m=t.slice(0,7),[ti,te]=sums(x=>x.date===t),[mi,me]=sums(x=>x.date.startsWith(m)),g=d.settings.dailyGoal;$('todayIncome').textContent=money(ti);$('todayExpense').textContent=money(te);$('todayNet').textContent=money(ti-te);$('monthIncome').textContent=money(mi);$('monthNet').textContent=money(mi-me);$('bar').style.width=Math.min(100,ti/g*100)+'%';$('goalText').textContent=ti>=g?'🎯 حققت هدف اليوم':'بقي '+money(g-ti)+' لهدف '+money(g);let need=d.settings.bills+d.settings.saving;$('monthGoal').textContent='المطلوب '+money(need)+' • المتبقي '+money(Math.max(0,need-mi));$('dailyGoal').value=d.settings.dailyGoal;$('bills').value=d.settings.bills;$('saving').value=d.settings.saving;$('entries').innerHTML=d.entries.length?d.entries.map(x=>'<div class="entry"><div><b>'+x.source+'</b><br><small>'+x.date+(x.note?' • '+x.note:'')+'</small></div><b class="'+(x.type==='income'?'green':'')+'">'+(x.type==='income'?'+':'-')+money(x.amount)+'</b></div>').join(''):'لا توجد حركات بعد'}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()</script></body></html>
