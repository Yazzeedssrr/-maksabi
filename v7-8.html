<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>مَكسبي V7.8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}#app{width:100%;height:100dvh;border:0;display:block}.loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.loading.hide{display:none}</style></head><body><div id="loading" class="loading">جاري تشغيل مَكسبي V7.8…</div><iframe id="app" src="/v7-7.html?v=20260916-v78" allow="geolocation;camera;microphone"></iframe><script>
const root=document.getElementById('app'),loading=document.getElementById('loading');
const read=()=>{try{return JSON.parse(localStorage.getItem('maksabi2')||'{}')}catch{return{}}};
function deepest(win){try{let w=win;for(let i=0;i<12;i++){const f=w.document?.getElementById('app');if(!f?.contentWindow)break;w=f.contentWindow}return w}catch{return null}}
function norm(s){s=String(s||'').trim().toLowerCase();if(/amazon|flex/.test(s))return'Amazon Flex';if(/door\s*dash|doordash|دورداش/.test(s))return'DoorDash';if(/uber/.test(s))return'Uber';if(/lyft/.test(s))return'Lyft';return s?String(s).trim():'أخرى'}
function cut(days){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-days+1);return x.toISOString().slice(0,10)}
function performance(days=30){const d=read(),from=cut(days),rpm=Number(d.settings?.carPerMile||0),m={};const g=k=>m[k]||(m[k]={source:k,income:0,expense:0,miles:0,hours:0});for(const x of d.entries||[]){if(String(x.date||'')<from)continue;const s=g(norm(x.source));if(x.type==='income')s.income+=+x.amount||0;else s.expense+=+x.amount||0}for(const x of d.trips||[]){if(String(x.date||'')<from)continue;const s=g(norm(x.source));s.miles+=+x.miles||0;s.hours+=+x.hours||0}return Object.values(m).map(s=>{const net=s.income-s.expense-s.miles*rpm;return{...s,net,perHour:s.hours>0?net/s.hours:null,perMile:s.miles>0?net/s.miles:null}}).filter(x=>x.income||x.hours||x.miles)}
function monthState(){const d=read(),now=new Date(),y=now.getFullYear(),m=now.getMonth(),days=new Date(y,m+1,0).getDate(),today=now.getDate(),start=`${y}-${String(m+1).padStart(2,'0')}-01`,end=`${y}-${String(m+1).padStart(2,'0')}-${String(days).padStart(2,'0')}`;let inc=0,exp=0,miles=0;for(const x of d.entries||[]){if(x.date>=start&&x.date<=end){if(x.type==='income')inc+=+x.amount||0;else exp+=+x.amount||0}}for(const x of d.trips||[]){if(x.date>=start&&x.date<=end)miles+=+x.miles||0}const reserve=miles*Number(d.settings?.carPerMile||0),net=inc-exp-reserve,need=Number(d.settings?.bills||0)+Number(d.settings?.saving||0),remaining=Math.max(0,need-net),daysLeft=Math.max(1,days-today+1);return{days,today,daysLeft,inc,exp,reserve,net,need,remaining,dailyRequired:remaining/daysLeft,weeklyRequired:remaining/daysLeft*7}}
function money(n){return'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function plan(){const p=performance(30).filter(x=>x.perHour!==null&&x.perHour>0).sort((a,b)=>b.perHour-a.perHour),ms=monthState();if(!p.length)return{month:ms,rows:[],note:'لا توجد ساعات عمل كافية في آخر 30 يومًا لبناء توزيع ساعات موثوق.'};const top=p.slice(0,3),sum=top.reduce((s,x)=>s+x.perHour,0),rows=top.map(x=>{const weight=x.perHour/sum,netTarget=ms.dailyRequired*weight,hours=netTarget/x.perHour;return{source:x.source,perHour:x.perHour,weight,netTarget,hours}});return{month:ms,rows,note:'التوزيع مبني على صافي/ساعة المسجل في آخر 30 يومًا. إذا كانت البيانات قليلة أو الظروف تغيرت، اعتبره نقطة بداية لا ضمانًا.'}}
function renderPlan(doc){const host=doc.getElementById('planBody');if(!host)return;const x=plan(),ms=x.month;host.innerHTML='';const a=doc.createElement('div');a.className='card';a.innerHTML='<h3>هدف الشهر</h3><div class="muted" style="line-height:1.9">الالتزامات + الادخار: <b>'+money(ms.need)+'</b><br>الصافي المسجل هذا الشهر بعد مخصص السيارة: <b>'+money(ms.net)+'</b><br>المتبقي: <b>'+money(ms.remaining)+'</b><br>المطلوب تقريبًا من الآن: <b>'+money(ms.dailyRequired)+'/يوم</b> • <b>'+money(ms.weeklyRequired)+'/7 أيام</b></div>';host.appendChild(a);if(x.rows.length){const b=doc.createElement('div');b.className='card';b.innerHTML='<h3>توزيع ساعات مقترح لليوم</h3>';for(const r of x.rows){const row=doc.createElement('div');row.style.cssText='padding:9px 0;border-top:1px solid rgba(255,255,255,.08)';row.innerHTML='<b>'+r.source+'</b><div class="muted">صافي/ساعة مسجل '+money(r.perHour)+' • هدف صافي '+money(r.netTarget)+' • تقريبًا '+r.hours.toFixed(1)+' ساعة</div>';b.appendChild(row)}host.appendChild(b)}const n=doc.createElement('div');n.className='card';n.innerHTML='<div class="muted" style="line-height:1.8">'+x.note+'</div>';host.appendChild(n)}
function patch(){const w=deepest(root.contentWindow);if(!w?.document)return false;const d=w.document;try{d.title='مَكسبي V7.8';const brand=d.querySelector('.brand b');if(brand)brand.textContent='مَكسبي V7.8';const small=d.querySelector('.brand small');if(small)small.textContent='خطة عمل ذكية • أهداف شهرية • توزيع ساعات • AI';const main=d.querySelector('main.wrap');if(main&&!d.getElementById('workPlan')){const s=d.createElement('section');s.id='workPlan';s.innerHTML='<h2>خطة العمل الذكية</h2><div class="card"><p class="muted">تحسب ما تبقى من التزاماتك وهدف الادخار، ثم تستخدم صافي/ساعة المسجل لكل منصة لبناء خطة يومية تقريبية.</p><button id="planAI" class="primary wide">دع المساعد يبني لي خطة مفصلة</button></div><div id="planBody"></div>';main.appendChild(s);d.getElementById('planAI').onclick=()=>{try{w.go('ai');const t=d.getElementById('txt');t.value='ابنِ لي خطة عمل عملية من بيانات مكسبي الحالية. احسب المتبقي من الالتزامات الشهرية وهدف الادخار، والمطلوب يوميًا وأسبوعيًا، واستخدم أداء آخر 30 يومًا لكل مصدر لتقترح توزيع ساعات واقعيًا. وضّح أن النتائج مبنية على بياناتي السابقة وليست ضمانًا، ولا تغيّر أي بيانات.';w.sendAI()}catch(e){console.warn(e)}}}const drawer=d.querySelector('.drawer');if(drawer&&!d.getElementById('workPlanNav')){const b=d.createElement('button');b.id='workPlanNav';b.textContent='🗓️ خطة العمل الذكية';b.onclick=()=>{w.go('workPlan');renderPlan(d)};drawer.appendChild(b)}if(!w.__v78ctx&&typeof w.ctx==='function'){w.__v78ctx=true;const old=w.ctx;w.ctx=function(){const c=old();c.monthPlan=monthState();c.workPlan=plan();return c}}const oldGo=w.go;if(typeof oldGo==='function'&&!w.__v78go){w.__v78go=true;w.go=function(id){const r=oldGo.apply(this,arguments);if(id==='workPlan')renderPlan(d);return r}}renderPlan(d);loading.classList.add('hide');return true}catch(e){console.warn('V7.8 patch',e);return false}}
function wait(){if(patch())return;setTimeout(wait,450)}root.addEventListener('load',()=>setTimeout(wait,500));setTimeout(()=>loading.classList.add('hide'),10000)
</script></body></html>
