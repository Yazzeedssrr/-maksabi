<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>مَكسبي V5</title><style>html,body{margin:0;width:100%;height:100%;background:#07101e;overflow:hidden}#app{width:100%;height:100dvh;border:0;display:block;background:#07101e}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#07101e;color:#eaf3ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;z-index:5}.loading.hide{display:none}</style></head><body><div id="loading" class="loading">جاري تشغيل مَكسبي V5…</div><iframe id="app" src="/v4.html?v=20260916-v5" allow="geolocation; camera; microphone"></iframe><script>const frame=document.getElementById('app'),loading=document.getElementById('loading');let queue=[];function getData(w){try{return JSON.parse(w.localStorage.getItem('maksabi2')||'{}')}catch{return{}}}function saveData(w,d){w.localStorage.setItem('maksabi2',JSON.stringify(d))}function describe(a,w){const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});if(a.type==='add_entry'){const p=a.payload||{};return(p.type==='income'?'إضافة دخل ':'إضافة مصروف ')+money(p.amount)+' • '+(p.source||'أخرى')+(p.note?' • '+p.note:'')}if(a.type==='update_settings'){const labels={dailyGoal:'هدف اليوم',bills:'الالتزامات الشهرية',saving:'هدف الادخار',carPerMile:'مخصص السيارة/ميل'};return Object.entries(a.payload||{}).map(([k,v])=>(labels[k]||k)+' = '+v).join(' • ')}return'إجراء غير معروف'}function applyAll(w){if(!queue.length)return;let d=getData(w);d.entries=Array.isArray(d.entries)?d.entries:[];d.trips=Array.isArray(d.trips)?d.trips:[];d.settings=d.settings||{};d.aiHistory=Array.isArray(d.aiHistory)?d.aiHistory:[];const now=new Date(),date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');let applied=0;for(const a of queue){if(a.type==='add_entry'){const p=a.payload||{},amt=Number(p.amount);if((p.type==='income'||p.type==='expense')&&Number.isFinite(amt)&&amt>0){d.entries.unshift({id:Date.now()+applied,date,type:p.type,amount:amt,source:String(p.source||'أخرى'),note:String(p.note||'أضيف بواسطة مساعد مكسبي')});applied++}}else if(a.type==='update_settings'){for(const k of ['dailyGoal','bills','saving','carPerMile']){if(a.payload&&a.payload[k]!==undefined&&Number.isFinite(Number(a.payload[k]))&&Number(a.payload[k])>=0)d.settings[k]=Number(a.payload[k])}applied++}}d.aiHistory.push({role:'assistant',content:applied>1?'تم تنفيذ '+applied+' تغييرات بعد موافقتك ✅':'تم تنفيذ التغيير بعد موافقتك ✅'});saveData(w,d);queue=[];w.location.reload()}function patch(){const w=frame.contentWindow,doc=w.document;if(!w||!doc)return;loading.classList.add('hide');try{const brand=doc.querySelector('.brand b');if(brand)brand.textContent='مَكسبي V5';const small=doc.querySelector('.brand small');if(small)small.textContent='مساعدك الذكي • يفهم • يحلل • ينفّذ بعد موافقتك'}catch{}const originalFetch=w.fetch.bind(w);w.fetch=async function(...args){const r=await originalFetch(...args);try{const u=String(args[0]&&args[0].url?args[0].url:args[0]||'');if(u.includes('/api/chat')){const j=await r.clone().json();if(Array.isArray(j.actions)&&j.actions.length){queue=j.actions;const body=JSON.stringify({...j,action:null});return new w.Response(body,{status:r.status,statusText:r.statusText,headers:r.headers})}}}catch(e){console.warn('Maksabi V5 fetch patch',e)}return r};w.renderAction=function(){const el=doc.getElementById('pendingAction');if(!el)return;el.innerHTML='';if(!queue.length)return;const box=doc.createElement('div');box.className='action';const title=doc.createElement('b');title.textContent=queue.length>1?'إجراءات مقترحة ('+queue.length+')':'إجراء مقترح';box.appendChild(title);queue.forEach((a,i)=>{const row=doc.createElement('div');row.style.cssText='margin-top:8px;padding:9px;border-radius:12px;background:#0b2033';row.textContent=(i+1)+'. '+describe(a,w);box.appendChild(row)});const buttons=doc.createElement('div');buttons.className='actionBtns';const ok=doc.createElement('button');ok.className='primary';ok.textContent=queue.length>1?'تأكيد وتنفيذ الكل':'تأكيد التنفيذ';ok.onclick=()=>applyAll(w);const no=doc.createElement('button');no.className='secondary';no.textContent='إلغاء';no.onclick=()=>{queue=[];w.renderAction()};buttons.append(ok,no);box.appendChild(buttons);el.appendChild(box)};setTimeout(()=>{try{w.renderAction()}catch{}},50)}frame.addEventListener('load',patch);setTimeout(()=>loading.classList.add('hide'),6000);</script></body></html>
