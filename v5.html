<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>مَكسبي V5</title><style>html,body{margin:0;width:100%;height:100%;background:#07101e;overflow:hidden}#app{width:100%;height:100dvh;border:0;display:block;background:#07101e}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#07101e;color:#eaf3ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;z-index:5}.loading.hide{display:none}.undo{position:fixed;left:14px;right:14px;bottom:88px;z-index:20;display:none;align-items:center;justify-content:space-between;gap:10px;background:#3b3117;color:#ffe7a4;border:1px solid #705d25;border-radius:16px;padding:11px 12px;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;box-shadow:0 12px 30px #0008}.undo.show{display:flex}.undo button{border:1px solid #8d7735;background:#5a491e;color:white;border-radius:12px;padding:8px 12px;font-weight:700}</style></head><body><div id="loading" class="loading">جاري تشغيل مَكسبي V5…</div><iframe id="app" src="/v4.html?v=20260916-v5b" allow="geolocation; camera; microphone"></iframe><div id="undo" class="undo"><span>آخر تنفيذ قابل للتراجع</span><button onclick="undoLast()">↩ تراجع</button></div><script>const frame=document.getElementById('app'),loading=document.getElementById('loading'),undoBar=document.getElementById('undo');let queue=[],lastSnapshot=null;function getData(w){try{return JSON.parse(w.localStorage.getItem('maksabi2')||'{}')}catch{return{}}}function saveData(w,d){w.localStorage.setItem('maksabi2',JSON.stringify(d))}function snap(d){return JSON.stringify({entries:Array.isArray(d.entries)?d.entries:[],trips:Array.isArray(d.trips)?d.trips:[],settings:d.settings||{}})}function money(n){return'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}function describe(a){const p=a.payload||{};if(a.type==='add_entry')return(p.type==='income'?'إضافة دخل ':'إضافة مصروف ')+money(p.amount)+' • '+(p.source||'أخرى')+(p.note?' • '+p.note:'');if(a.type==='update_settings'){const labels={dailyGoal:'هدف اليوم',bills:'الالتزامات الشهرية',saving:'هدف الادخار',carPerMile:'مخصص السيارة/ميل'};return'تحديث: '+Object.entries(p).map(([k,v])=>(labels[k]||k)+' = '+v).join(' • ')}if(a.type==='add_trip')return'إضافة عمل/رحلة • '+Number(p.miles||0).toFixed(1)+' ميل • '+Number(p.hours||0).toFixed(1)+' ساعة • '+(p.source||'يدوي');if(a.type==='update_entry')return'تعديل القيد #'+p.id+' • '+Object.entries(p.patch||{}).map(([k,v])=>k+'='+v).join(' • ');if(a.type==='delete_entry')return'حذف القيد #'+p.id;return'إجراء: '+a.type}function applyAll(w){if(!queue.length)return;let d=getData(w);d.entries=Array.isArray(d.entries)?d.entries:[];d.trips=Array.isArray(d.trips)?d.trips:[];d.settings=d.settings||{};d.aiHistory=Array.isArray(d.aiHistory)?d.aiHistory:[];d.audit=Array.isArray(d.audit)?d.audit:[];lastSnapshot=snap(d);const now=new Date(),date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');let applied=0,summary=[];for(const a of queue){const p=a.payload||{};if(a.type==='add_entry'){const amt=Number(p.amount);if((p.type==='income'||p.type==='expense')&&Number.isFinite(amt)&&amt>0){d.entries.unshift({id:Date.now()+applied,date,type:p.type,amount:amt,source:String(p.source||'أخرى'),note:String(p.note||'أضيف بواسطة مساعد مكسبي')});applied++;summary.push(describe(a))}}else if(a.type==='update_settings'){let changed=false;for(const k of ['dailyGoal','bills','saving','carPerMile']){if(p[k]!==undefined&&Number.isFinite(Number(p[k]))&&Number(p[k])>=0){d.settings[k]=Number(p[k]);changed=true}}if(changed){applied++;summary.push(describe(a))}}else if(a.type==='add_trip'){const miles=Number(p.miles||0),hours=Number(p.hours||0);if(Number.isFinite(miles)&&Number.isFinite(hours)&&miles>=0&&hours>=0&&(miles>0||hours>0)){d.trips.unshift({id:Date.now()+applied,date,source:String(p.source||'يدوي'),miles,hours,note:String(p.note||'أضيف بواسطة مساعد مكسبي')});applied++;summary.push(describe(a))}}else if(a.type==='update_entry'){const x=d.entries.find(x=>Number(x.id)===Number(p.id));if(x&&p.patch&&typeof p.patch==='object'){const q=p.patch;if(q.type==='income'||q.type==='expense')x.type=q.type;if(q.amount!==undefined&&Number(q.amount)>0)x.amount=Number(q.amount);if(q.source!==undefined)x.source=String(q.source);if(q.note!==undefined)x.note=String(q.note);applied++;summary.push(describe(a))}}else if(a.type==='delete_entry'){const before=d.entries.length;d.entries=d.entries.filter(x=>Number(x.id)!==Number(p.id));if(d.entries.length<before){applied++;summary.push(describe(a))}}}d.audit.unshift({id:Date.now(),at:new Date().toISOString(),count:applied,summary});d.aiHistory.push({role:'assistant',content:applied>1?'تم تنفيذ '+applied+' تغييرات بعد موافقتك ✅':'تم تنفيذ التغيير بعد موافقتك ✅'});saveData(w,d);try{localStorage.setItem('maksabi2',JSON.stringify(d))}catch{}queue=[];undoBar.classList.toggle('show',!!applied);w.location.reload()}function undoLast(){if(!lastSnapshot)return;const w=frame.contentWindow;let d=getData(w);try{const s=JSON.parse(lastSnapshot);d.entries=s.entries;d.trips=s.trips;d.settings=s.settings;d.aiHistory=Array.isArray(d.aiHistory)?d.aiHistory:[];d.audit=Array.isArray(d.audit)?d.audit:[];d.audit.unshift({id:Date.now(),at:new Date().toISOString(),count:0,summary:['تراجع عن آخر تنفيذ']});d.aiHistory.push({role:'assistant',content:'تم التراجع عن آخر تنفيذ ↩️'});saveData(w,d);lastSnapshot=null;undoBar.classList.remove('show');w.location.reload()}catch(e){console.warn(e)}}function patch(){const w=frame.contentWindow,doc=w.document;if(!w||!doc)return;loading.classList.add('hide');try{const brand=doc.querySelector('.brand b');if(brand)brand.textContent='مَكسبي V5';const small=doc.querySelector('.brand small');if(small)small.textContent='مساعد عام ذكي • يرى • يفهم • يخطط • ينفّذ بعد موافقتك';const chip=doc.querySelector('#ai .pill');if(chip)chip.textContent='أي لغة • صور • فيديو • أوامر متعددة • تراجع'}catch{}const originalFetch=w.fetch.bind(w);w.fetch=async function(...args){try{const req=args[1]||{};const body=typeof req.body==='string'?JSON.parse(req.body):null;const msg=String(body?.message||'').trim();if(queue.length&&/^(نعم|نعم نفّذ|نفّذ|نفذ|نفذها|نفّذها|نفذ ذلك|نفّذ ذلك|سجّل|سجل|سجّلها|سجلها|أضفها|اضفها|أضف ذلك|اضف ذلك|طبقها|طبّقها|موافق|تمام|كمل|اكمل|ok|yes|do it|confirm)$/i.test(msg)){applyAll(w);return new w.Response(JSON.stringify({reply:'تم تنفيذ الإجراءات التي وافقت عليها ✅',actions:[]}),{status:200,headers:{'Content-Type':'application/json'}})}}catch(e){console.warn('Maksabi confirmation',e)}const r=await originalFetch(...args);try{const u=String(args[0]&&args[0].url?args[0].url:args[0]||'');if(u.includes('/api/chat')){const j=await r.clone().json();if(Array.isArray(j.actions)&&j.actions.length){queue=j.actions.slice(0,8);const body=JSON.stringify({...j,action:null});return new w.Response(body,{status:r.status,statusText:r.statusText,headers:r.headers})}}}catch(e){console.warn('Maksabi V5 fetch patch',e)}return r};w.renderAction=function(){const el=doc.getElementById('pendingAction');if(!el)return;el.innerHTML='';if(!queue.length)return;const box=doc.createElement('div');box.className='action';const title=doc.createElement('b');title.textContent=queue.length>1?'إجراءات مقترحة ('+queue.length+')':'إجراء مقترح';box.appendChild(title);const hint=doc.createElement('div');hint.className='muted';hint.style.marginTop='5px';hint.textContent='لن يتم أي تغيير قبل موافقتك.';box.appendChild(hint);queue.forEach((a,i)=>{const row=doc.createElement('div');row.style.cssText='margin-top:8px;padding:10px;border-radius:12px;background:#0b2033;border:1px solid #234764';const txt=doc.createElement('div');txt.textContent=(i+1)+'. '+describe(a);const rm=doc.createElement('button');rm.className='secondary';rm.style.cssText='margin-top:7px;padding:7px 10px;width:auto';rm.textContent='إزالة هذا الإجراء';rm.onclick=()=>{queue.splice(i,1);w.renderAction()};row.append(txt,rm);box.appendChild(row)});const buttons=doc.createElement('div');buttons.className='actionBtns';const ok=doc.createElement('button');ok.className='primary';ok.textContent=queue.length>1?'تأكيد وتنفيذ الكل':'تأكيد التنفيذ';ok.onclick=()=>applyAll(w);const no=doc.createElement('button');no.className='secondary';no.textContent='إلغاء الكل';no.onclick=()=>{queue=[];w.renderAction()};buttons.append(ok,no);box.appendChild(buttons);el.appendChild(box)};setTimeout(()=>{try{w.renderAction()}catch{}},60)}frame.addEventListener('load',patch);setTimeout(()=>loading.classList.add('hide'),6000);</script></body></html>
