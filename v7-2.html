<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>مَكسبي V7.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}#app{width:100%;height:100dvh;border:0;display:block}.loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.loading.hide{display:none}</style></head><body><div id="loading" class="loading">جاري تشغيل مَكسبي V7.2…</div><iframe id="app" src="/v7-1.html?v=20260916-v72" allow="geolocation;camera;microphone"></iframe><script>const frame=document.getElementById('app'),loading=document.getElementById('loading');function money(n){return'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}function day(x=new Date()){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function read(){try{return JSON.parse(localStorage.getItem('maksabi2')||'{}')}catch{return{}}}function sums(d,date){const a=(d.entries||[]).filter(x=>x.date===date);return[a.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0)]}function buildInsights(w,doc){const d=read(),t=day(),[i,e]=sums(d,t),tr=(d.trips||[]).filter(x=>x.date===t),m=tr.reduce((s,x)=>s+Number(x.miles||0),0),h=tr.reduce((s,x)=>s+Number(x.hours||0),0),reserve=m*Number(d.settings?.carPerMile||0),net=i-e-reserve,goal=Number(d.settings?.dailyGoal||200),items=[];if(i||e||m||h){if(net<goal)items.push('باقي على هدف اليوم '+money(Math.max(0,goal-net))+'.');else items.push('هدف اليوم متحقق بفارق '+money(net-goal)+'.');if(h>0)items.push('صافي الساعة '+money(net/h)+'.');if(m>0)items.push('الدخل لكل ميل '+money(i/m)+'، ومخصص السيارة '+money(reserve)+'.');if(i>0&&e/i>=.3)items.push('المصاريف تساوي '+Math.round(e/i*100)+'% من دخل اليوم؛ هذه نسبة تستحق المراجعة.');if(h===0&&i>0)items.push('لديك دخل مسجل اليوم لكن لا توجد ساعات عمل؛ إضافتها ستجعل تحليل الكفاءة أدق.');if(m===0&&i>0)items.push('لديك دخل مسجل اليوم لكن لا توجد ميلات؛ تسجيلها يساعد على قياس تكلفة السيارة.')}else items.push('لا توجد بيانات كافية لليوم بعد. عندما تسجل الدخل أو المصروف أو العمل سيبدأ مكسبي بإظهار تنبيهات تلقائية هنا.');let wi=0,we=0,active=0;for(let k=0;k<7;k++){let x=new Date();x.setDate(x.getDate()-k);let[a,b]=sums(d,day(x));wi+=a;we+=b;if(a||b)active++}if(active>=2){const avg=(wi-we)/active;items.push('متوسط الصافي في الأيام النشطة خلال آخر 7 أيام: '+money(avg)+'.');const monthlyNeed=Number(d.settings?.bills||0)+Number(d.settings?.saving||0);if(monthlyNeed>0){const pace=avg*30;items.push(pace>=monthlyNeed?'وتيرتك الحالية أعلى من احتياجك الشهري المحدد.':'وتيرتك الحالية أقل من مجموع الالتزامات + هدف الادخار بحوالي '+money(Math.max(0,monthlyNeed-pace))+' شهريًا إذا استمر نفس المتوسط.')}}return items}function askAI(w,prompt){try{w.go('ai');const txt=w.document.getElementById('txt');txt.value=prompt;w.sendAI()}catch(e){console.warn(e)}}function patch(){const w=frame.contentWindow,doc=w.document;if(!w||!doc)return;loading.classList.add('hide');try{doc.title='مَكسبي V7.2';const brand=doc.querySelector('.brand b');if(brand)brand.textContent='مَكسبي V7.2';const small=doc.querySelector('.brand small');if(small)small.textContent='مساعد ذكي استباقي • صور وفيديو • GPS • تنفيذ بعد موافقتك';const home=doc.getElementById('home');if(home&&!doc.getElementById('smartInsights')){const card=doc.createElement('div');card.id='smartInsights';card.className='card';const h=doc.createElement('h3');h.textContent='🧠 تنبيهات مكسبي الذكية';const wrap=doc.createElement('div');wrap.id='insightList';wrap.className='muted';wrap.style.lineHeight='1.8';const btn=doc.createElement('button');btn.className='primary wide';btn.style.marginTop='12px';btn.textContent='حلل وضعي بعمق';btn.onclick=()=>askAI(w,'حلل وضعي الحالي في مكسبي بعمق. استخدم بيانات اليوم وآخر 7 أيام والأهداف والإعدادات، وقل لي ما المهم الآن وما الذي ينبغي أن أراقبه. لا تسجل أو تغير أي بيانات إلا إذا طلبت منك ذلك صراحة.');card.append(h,wrap,btn);const week=doc.getElementById('week')?.parentElement;if(week&&week.parentNode)week.parentNode.insertBefore(card,week);else home.appendChild(card)}const paint=()=>{const el=doc.getElementById('insightList');if(el)el.innerHTML=buildInsights(w,doc).map(x=>'• '+x).join('<br>')};paint();const originalRender=w.render;w.render=function(...args){const r=originalRender.apply(this,args);try{paint()}catch{}return r};}catch(e){console.warn('V7.2 patch error',e)}}frame.addEventListener('load',patch);setTimeout(()=>loading.classList.add('hide'),7000)</script></body></html>
